# Generated with `winget configure export`, edited by hand for entries that
# weren't installed on the export machine (winget configure export requires a
# package to already be installed to export its resource block).
#
# Packages skipped entirely (no winget equivalent, or already provided by
# Windows itself):
#   coretemp            -> ALCPU.CoreTemp
#   cura-new             no winget package
#   curl                 built into Windows 10 1803+ and Windows 11
#   firefox              -> Mozilla.Firefox
#   geforce-experience   only on Microsoft Store: winget install --id XP8CLZL93F5Z4P -s msstore
#   javaruntime/jre8     -> Oracle.JavaRuntimeEnvironment
#   modernflyouts        -> ModernFlyouts.ModernFlyouts
#   mremoteng            -> mRemoteNG.mRemoteNG
#   obs-studio           -> OBSProject.OBSStudio
#   occt                 -> OCBase.OCCT.Personal
#   openjdk               vendor-specific on winget (e.g. EclipseAdoptium.Temurin.21.JDK), pick one
#   paint.net            -> dotPDN.PaintDotNet
#   postman              -> Postman.Postman
#   putty                -> PuTTY.PuTTY
#   qflipper             -> FlipperDevicesInc.qFlipper
#   rufus                -> Rufus.Rufus
#   sharex               -> ShareX.ShareX
#   steelseries-engine   -> SteelSeries.SteelSeriesEngine
#   tor-browser          -> TorProject.TorBrowser
#   wireshark            -> WiresharkFoundation.Wireshark
#   zoom                 -> Zoom.Zoom
#   docker-cli/compose    bundled with Docker.DockerDesktop
#   winget/winget-cli     this is winget itself, already required to run this
#   wsl2                  handled separately in ApplicationInstall.ps1 via `wsl --install`
# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.3
$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
